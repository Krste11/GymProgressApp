<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Progress Tracker</title>
    <link rel="stylesheet" href="./css/home.css" />
</head>

<body>
    <h1>🏋️ Gym Progress Tracker</h1>

    <!-- ✅ Add Exercise Form -->
    <section id="addExerciseSection">
        <h2>Add New Exercise</h2>
        <form id="exerciseForm">
            <input type="text" id="exerciseName" placeholder="Exercise name" required />
            <input type="number" id="exerciseWeight" placeholder="Weight (kg)" required />
            <input type="number" id="exerciseReps" placeholder="Repetitions" required />
            <button type="submit">Add Exercise</button>
        </form>
        <p id="statusMsg"></p>
    </section>

    <!-- ✅ Table Section -->
    <table id="exerciseTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Exercise Name</th>
                <th>Weight (kg)</th>
                <th>Repetitions</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows will be inserted here by JS -->
        </tbody>
    </table>


    <script src="./js/home.js"></script>
</body>

</html>
